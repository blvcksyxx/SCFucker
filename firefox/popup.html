<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCFucker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --text: #f0f0f0;
      --muted: #666666;
      --accent: #ffffff;
      --on: #f0f0f0;
      --off: #333333;
      --radius: 14px;
    }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 0;
      user-select: none;
    }

    .header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo span {
      color: var(--muted);
      font-weight: 400;
    }

    .version {
      font-size: 10px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 7px;
    }

    .main {
      padding: 20px;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .toggle-label strong {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .toggle-label small {
      font-size: 11px;
      color: var(--muted);
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--off);
      border-radius: 100px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    input:checked + .slider {
      background: #1a1a1a;
      border: 1px solid #444;
    }

    input:checked + .slider::before {
      transform: translateX(20px);
      background: var(--accent);
    }

    /* Status */
    .status {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.active { background: #e8e8e8; box-shadow: 0 0 6px rgba(255,255,255,0.3); }
    .status-dot.inactive { background: #333; }

    .status-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .status-text strong {
      color: var(--text);
      font-weight: 500;
      display: block;
    }

    /* Proxy info */
    .proxy-info {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .proxy-info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .proxy-info-left label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .proxy-info-left span {
      font-size: 12px;
      color: var(--text);
      font-family: 'Space Grotesk', monospace;
    }

    .settings-btn {
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      font-family: 'Inter', sans-serif;
    }

    .settings-btn:hover { color: var(--text); border-color: #444; }

    /* Footer */
    .footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer a {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover { color: var(--text); }

    .footer-links { display: flex; gap: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">SC<span>Fucker</span></div>
    <div class="version">v1.0.0</div>
  </div>

  <div class="main">
    <div class="toggle-row">
      <div class="toggle-label">
        <strong>Geo bypass</strong>
        <small>Route SoundCloud API through proxy</small>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="status" id="statusBlock">
      <div class="status-dot inactive" id="statusDot"></div>
      <div class="status-text">
        <strong id="statusTitle">Disabled</strong>
        <span id="statusDesc">Tracks will be geo-restricted</span>
      </div>
    </div>

    <div class="proxy-info">
      <div class="proxy-info-left">
        <label>Active proxy</label>
        <span id="proxyDisplay">—</span>
      </div>
      <button class="settings-btn" id="openSettings">Configure</button>
    </div>
  </div>

  <div class="footer">
    <span style="font-size:11px;color:#444;">by blvcksyxx</span>
    <div class="footer-links">
      <a href="https://blvcksyxx.xyz" target="_blank">website</a>
      <a href="https://github.com/blvcksyxx/SCFucker" target="_blank">github</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
